[project]
name = "sistema-atencion-cliente"
version = "0.1.0"
description = "Sistema de atención al cliente"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build && node frontend/scripts/clean-node-modules.cjs"

[tool.vercel.fastapi.static]
exclude = true
